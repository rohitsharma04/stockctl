[general]
market = "us"  # us, india, japan, uk, germany, etc. (run 'stockctl markets' to list)
min_price = 5.0
workers = 8
output = "table"

[screeners.breakout_caution]
bollinger_period = 20
bollinger_std = 2.0
volume_multiplier = 1.5
sma_window = 10
atr_window = 14
rs_threshold = 1.05
momentum_period = 22
momentum_threshold = 0.10

[screeners.high_performance]
sma_200_increase_days = 90
max_close_checkpoints = 4
min_data_days = 756
double_from_low = true
drawdown_floor = 0.70
high_floor = 0.75

[screeners.stellar_breakout]
fibonacci_level = 0.618
volume_significance = 0.3
volume_explosion_ratio = 0.5
recent_weeks = 5

[screeners.descending_breakout]
months = 36
false_breakout_tolerance = 6
volume_multiplier = 1.5

[pairs]
correlation_threshold = 0.7
z_threshold = 2.0
z_exit_low = -0.5
z_exit_high = 0.5
window = 50
capital = 100000
stocks = [
    "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS",
    "HINDUNILVR.NS", "ITC.NS", "SBIN.NS", "BHARTIARTL.NS", "KOTAKBANK.NS"
]

[backtest]
tp_min = 0.05
tp_max = 0.50
tp_step = 0.05
sl_min = 0.01
sl_max = 0.10
sl_step = 0.01
capital = 100000
min_reward_risk = 3.0

